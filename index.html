<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supreme Command | UNASEMEJE SMM GAINS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
  --primary: #38bdf8;
  --bg-dark: #020617;
  --bg-card: #0f172a;
  --text-dim: #94a3b8;
  --accent-purple: #8b5cf6;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #fbbf24;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-dark);
  color: white;
  overflow-x: hidden;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 260px;
  height: 100vh;
  position: fixed;
  background: var(--bg-dark);
  padding: 30px 20px;
  border-right: 1px solid #1e293b;
  z-index: 100;
  overflow-y: auto;
}

.sidebar h2 { 
  color: var(--primary); 
  font-size: 1.2rem; 
  margin-bottom: 10px;
  text-align: center;
}

.sidebar .site-name {
  text-align: center;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 30px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.sidebar a {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  margin: 8px 0;
  cursor: pointer;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 10px;
  transition: 0.2s;
}

.sidebar a i { margin-right: 12px; }
.sidebar a:hover, .sidebar a.active { color: white; background: rgba(56, 189, 248, 0.1); }

/* --- MAIN CONTENT --- */
.main { margin-left: 260px; padding: 40px; }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-card);
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #1e293b;
}

.stat-card h3 { font-size: 0.8rem; color: var(--text-dim); margin: 0; text-transform: uppercase; }
.stat-card p { font-size: 1.8rem; font-weight: bold; margin: 10px 0 0; color: var(--primary); }

.card {
  background: var(--bg-card);
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #1e293b;
  margin-bottom: 20px;
}

/* --- TABLES --- */
.table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: #1e293b; text-align: left; padding: 15px; color: var(--primary); }
td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }

.search-bar {
    width: 100%;
    padding: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    margin-bottom: 20px;
    box-sizing: border-box;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover { opacity: 0.8; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-balance { background: var(--primary); color: #082f49; }
.btn-approve { background: var(--success); color: #052e16; }
.btn-danger { background: var(--danger); color: white; }
.btn-success { background: var(--success); color: #052e16; }
.btn-purple { background: var(--accent-purple); color: white; }

/* --- ALERTS --- */
.alert {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.alert-success { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); color: #86efac; }
.alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5; }
.alert-info { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); color: #7dd3fc; }

/* --- LOADING SPINNER --- */
.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: currentColor;
    animation: spin 0.8s ease-in-out infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* --- MAINTENANCE STATUS INDICATOR --- */
.maintenance-status {
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}
.maintenance-status.online { background: rgba(34, 197, 94, 0.1); border: 2px solid var(--success); }
.maintenance-status.offline { background: rgba(239, 68, 68, 0.1); border: 2px solid var(--danger); }
.status-icon { font-size: 32px; }
.status-icon.online { color: var(--success); }
.status-icon.offline { color: var(--danger); }
.status-text h3 { margin: 0 0 5px 0; }
.status-text p { margin: 0; font-size: 14px; color: var(--text-dim); }

.maintenance-buttons { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
.maintenance-buttons button { padding: 12px 24px; font-size: 14px; font-weight: 700; }

/* --- CUSTOM TOGGLE SWITCH (DARK THEME) --- */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #334155;
    transition: .3s;
    border-radius: 24px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
}
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(22px); }

/* --- AUDIO FILE DISPLAY --- */
.uploaded-file-card {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #334155;
}

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.file-icon {
    width: 40px;
    height: 40px;
    background: rgba(139, 92, 246, 0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-purple);
    font-size: 18px;
}

.file-details {
    flex: 1;
}

.file-details h4 {
    margin: 0;
    color: white;
    font-size: 14px;
}

.file-details small {
    color: var(--text-dim);
    font-size: 12px;
}

.audio-player {
    width: 100%;
    margin-top: 10px;
    height: 40px;
}

.file-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.no-file {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-style: italic;
}

.upload-status {
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 13px;
    display: none;
}

.upload-status.show {
    display: block;
}

.upload-status.success {
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid var(--success);
    color: #86efac;
}

.upload-status.error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--danger);
    color: #fca5a5;
}

.upload-status.info {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid var(--primary);
    color: #7dd3fc;
}

/* --- SOCIAL PREVIEW SPECIAL CARDS --- */
.social-card-preview {
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 15px;
    border: 1px solid #334155;
    max-width: 500px;
}
.social-card-img {
    width: 100%;
    height: 250px;
    background-size: cover;
    background-position: center;
    background-color: #0f172a;
    border-bottom: 1px solid #334155;
}
.social-card-details {
    padding: 15px;
}
.social-card-domain {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}
.social-card-title {
    font-size: 15px;
    font-weight: bold;
    color: white;
    margin-bottom: 5px;
}
.social-card-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
}

@media (max-width: 768px) {
    .sidebar { width: 70px; }
    .sidebar span, .sidebar h2, .sidebar .site-name { display: none; }
    .main { margin-left: 70px; padding: 20px; }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Supreme Admin</h2>
  <div class="site-name">UNASEMEJE SMM GAINS</div>
  <a onclick="loadStats()" id="nav-stats" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
  <a onclick="loadUsers()" id="nav-users"><i class="fas fa-user-shield"></i> <span>User Control</span></a>
  <a onclick="loadDeposits()" id="nav-deposits"><i class="fas fa-money-bill-wave"></i> <span>Deposits</span></a>
  <a onclick="loadOrders()" id="nav-orders"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a>
  
  <a onclick="loadActivationCodes()" id="nav-activation"><i class="fas fa-key"></i> <span>Activation Codes</span></a>
  <a onclick="loadTickets()" id="nav-tickets"><i class="fas fa-life-ring"></i> <span>Support Tickets</span></a>
  <a onclick="loadTicker()" id="nav-ticker"><i class="fas fa-bullhorn"></i> <span>Top Ticker</span></a>
  <a onclick="loadChatLogs()" id="nav-chatlogs"><i class="fas fa-shield-alt"></i> <span>Chat Security</span></a>
  
  <a onclick="loadAudioSettingsAdmin()" id="nav-audio"><i class="fas fa-music"></i> <span>Audio Settings</span></a>
  <a onclick="loadSeoSettingsAdmin()" id="nav-seo"><i class="fas fa-share-alt"></i> <span>SEO & Socials</span></a>

  <a onclick="loadSiteControl()" id="nav-site"><i class="fas fa-globe"></i> <span>Site Control</span></a>
  <hr style="border: 0; border-top: 1px solid #1e293b; margin: 20px 0;">
  <a onclick="location.reload()" style="color: var(--danger);"><i class="fas fa-redo"></i> <span>Refresh</span></a>
</div>

<div class="main">
  <h1 id="pageTitle">Insights & Maintenance</h1>
  
  <div id="alertArea"></div>
  
  <div class="stats-grid">
      <div class="stat-card"><h3>Global Users</h3><p id="stat-users">0</p></div>
      <div class="stat-card"><h3>Total Float</h3><p id="stat-money">KES 0</p></div>
      <div class="stat-card"><h3>Action Needed</h3><p id="stat-deposits" style="color:#fbbf24">0</p></div>
  </div>

  <div id="contentArea">
      <div class="card" style="text-align: center; color: var(--text-dim);">
          <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
          <p>Loading Supreme Command...</p>
      </div>
  </div>
</div>

<script>
const API = "https://unasemeje-backend.vercel.app/api";

function showAlert(type, message) {
    const alertArea = document.getElementById('alertArea');
    const alertClass = type === 'success' ? 'alert-success' : type === 'error' ? 'alert-error' : 'alert-info';
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    
    alertArea.innerHTML = `
        <div class="alert ${alertClass}">
            <i class="fas ${icon}"></i>
            <span>${message}</span>
        </div>
    `;
    
    setTimeout(() => { alertArea.innerHTML = ''; }, 5000);
}

function setActiveNav(navId, title) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    const targetNav = document.getElementById(navId);
    if (targetNav) targetNav.classList.add('active');
    if (title) document.getElementById('pageTitle').innerText = title;
}

async function adminFetch(endpoint, method = "GET", body = null) {
  try {
    const opts = {
      method,
      headers: { "Content-Type": "application/json" }
    };
    if (body) opts.body = JSON.stringify(body);
    
    const res = await fetch(API + endpoint, opts);
    
    if (!res.ok) {
        const errorText = await res.text();
        console.error(`API Error ${res.status}:`, errorText);
        return { error: `HTTP ${res.status}: ${errorText}`, success: false };
    }
    
    const data = await res.json();
    return data;
  } catch (err) { 
      console.error('Fetch error:', err);
      document.getElementById("contentArea").innerHTML = `
        <div class="card" style="color: var(--danger); text-align: center;">
            <h3><i class="fas fa-exclamation-triangle"></i> Server Offline</h3>
            <p>Cannot connect to the backend API.</p>
            <p style="font-size: 12px; color: var(--text-dim);">Error: ${err.message}</p>
        </div>`;
      return { error: "Server Offline: " + err.message, success: false }; 
  }
}

/* =========================================
 * 🔑 ACTIVATION CODES MANAGEMENT
 * ========================================= */
async function loadActivationCodes() {
    setActiveNav('nav-activation', 'Activation Code Management');
    
    document.getElementById("contentArea").innerHTML = `
        <div class="card" style="text-align: center; color: var(--text-dim);">
            <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
            <p>Loading Activation Codes...</p>
        </div>
    `;

    const data = await adminFetch("/admin/activation-codes");
    
    if (data.error) {
        document.getElementById("contentArea").innerHTML = `<div class="card" style="color:var(--danger)">Failed to load activation codes: ${data.error}</div>`;
        return;
    }

    const codes = data.codes || data.data || [];

    let html = `
        <div class="card">
            <h3><i class="fas fa-key" style="color: var(--primary);"></i> Generate Activation Code</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 12px;">Custom Code (Optional)</label>
                    <input type="text" id="genCustomCode" class="search-bar" style="margin-bottom: 0;" placeholder="Auto-generated if blank">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 12px;">Value Amount (KES)</label>
                    <input type="number" id="genAmount" class="search-bar" style="margin-bottom: 0;" value="100" min="1">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-dim); font-size: 12px;">Max Uses</label>
                    <input type="number" id="genMaxUses" class="search-bar" style="margin-bottom: 0;" value="1" min="1">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-success" onclick="generateActivationCode()" id="btnGenCode" style="width: 100%; padding: 12px;"><i class="fas fa-plus"></i> Generate Code</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <tr>
                    <th>Code</th>
                    <th>Value</th>
                    <th>Uses</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
    `;

    if (codes.length === 0) {
        html += `<tr><td colspan="6" style="text-align:center; color: var(--text-dim); padding: 30px;">No activation codes found.</td></tr>`;
    } else {
        codes.forEach(c => {
            const isUsed = c.usedCount >= c.maxUses;
            const statusBadge = isUsed ? '<span style="color: var(--danger); font-weight: bold;">USED</span>' : '<span style="color: var(--success); font-weight: bold;">ACTIVE</span>';
            const date = new Date(c.createdAt).toLocaleString();
            
            html += `<tr>
                <td><code>${c.code}</code></td>
                <td style="color: var(--primary); font-weight: bold;">KES ${(c.amount || 0).toFixed(2)}</td>
                <td>${c.usedCount || 0} / ${c.maxUses || 1}</td>
                <td>${statusBadge}</td>
                <td><small style="color: var(--text-dim);">${date}</small></td>
                <td>
                    <button class="btn-danger" onclick="deleteActivationCode('${c._id}')"><i class="fas fa-trash"></i> Delete</button>
                </td>
            </tr>`;
        });
    }

    html += `</table></div>`;
    document.getElementById("contentArea").innerHTML = html;
}

async function generateActivationCode() {
    const code = document.getElementById('genCustomCode').value.trim();
    const amount = parseFloat(document.getElementById('genAmount').value);
    const maxUses = parseInt(document.getElementById('genMaxUses').value);

    if (isNaN(amount) || amount <= 0) {
        showAlert('error', 'Please enter a valid amount');
        return;
    }

    const btn = document.getElementById('btnGenCode');
    btn.innerHTML = '<span class="spinner"></span> Generating...';
    btn.disabled = true;

    const res = await adminFetch("/admin/activation-codes/generate", "POST", { code, amount, maxUses });

    if (res.success) {
        showAlert('success', 'Activation code generated successfully!');
        loadActivationCodes();
    } else {
        showAlert('error', 'Failed to generate code: ' + (res.error || 'Unknown error'));
        btn.innerHTML = '<i class="fas fa-plus"></i> Generate Code';
        btn.disabled = false;
    }
}

async function deleteActivationCode(id) {
    if (!confirm("Are you sure you want to delete this activation code?")) return;
    
    const res = await adminFetch("/admin/activation-codes/" + id, "DELETE");
    if (res.success) {
        showAlert('success', 'Activation code deleted.');
        loadActivationCodes();
    } else {
        showAlert('error', 'Failed to delete code: ' + (res.error || 'Unknown error'));
    }
}

/* =========================================
 * 📁 AUDIO FILE UPLOAD HANDLER (BASE64)
 * ========================================= */
async function uploadAudioFile(fileInputId, urlInputId, btnId, audioType, statusId) {
    const fileInput = document.getElementById(fileInputId);
    const urlInput = document.getElementById(urlInputId);
    const btn = document.getElementById(btnId);
    const statusDiv = document.getElementById(statusId);
    
    if (!fileInput.files || !fileInput.files[0]) {
        showAlert('error', 'Please select an audio file first!');
        return;
    }
    
    const file = fileInput.files[0];
    
    console.log(`\n[UPLOAD] Starting upload for ${audioType}`);
    console.log(`[UPLOAD] File: ${file.name}`);
    console.log(`[UPLOAD] Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`);
    console.log(`[UPLOAD] Type: ${file.type}`);
    
    if (file.size > 10 * 1024 * 1024) {
        showAlert('error', 'File too large! Maximum size is 10MB.');
        return;
    }
    
    if (!file.type.startsWith('audio/')) {
        showAlert('error', 'Please upload an audio file (MP3, WAV, OGG).');
        return;
    }
    
    btn.innerHTML = '<span class="spinner"></span> Processing...';
    btn.disabled = true;

    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64Data = e.target.result;
        
        const res = await adminFetch("/admin/audio/upload", "POST", {
            audioType,
            audioData: base64Data,
            fileName: file.name,
            fileSize: file.size
        });

        if (res.success) {
            showAlert('success', `${file.name} uploaded successfully!`);
            if (urlInput) urlInput.value = base64Data;
        } else {
            showAlert('error', 'Failed to upload audio: ' + (res.error || 'Unknown error'));
        }
        btn.innerHTML = '<i class="fas fa-upload"></i> Upload Audio';
        btn.disabled = false;
    };

    reader.onerror = function() {
        showAlert('error', 'Failed to read audio file.');
        btn.innerHTML = '<i class="fas fa-upload"></i> Upload Audio';
        btn.disabled = false;
    };

    reader.readAsDataURL(file);
}

// Initial load
loadActivationCodes();
</script>

</body>
</html>
