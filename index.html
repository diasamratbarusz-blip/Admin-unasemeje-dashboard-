<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supreme Command | UNASEMEJE SMM GAINS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
  --primary: #38bdf8;
  --bg-dark: #020617;
  --bg-card: #0f172a;
  --text-dim: #94a3b8;
  --accent-purple: #8b5cf6;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #fbbf24;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-dark);
  color: white;
  overflow-x: hidden;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 260px;
  height: 100vh;
  position: fixed;
  background: var(--bg-dark);
  padding: 30px 20px;
  border-right: 1px solid #1e293b;
  z-index: 100;
  overflow-y: auto;
}

.sidebar h2 { 
  color: var(--primary); 
  font-size: 1.2rem; 
  margin-bottom: 10px;
  text-align: center;
}

.sidebar .site-name {
  text-align: center;
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 30px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.sidebar a {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  margin: 8px 0;
  cursor: pointer;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 10px;
  transition: 0.2s;
}

.sidebar a i { margin-right: 12px; }
.sidebar a:hover, .sidebar a.active { color: white; background: rgba(56, 189, 248, 0.1); }

/* --- MAIN CONTENT --- */
.main { margin-left: 260px; padding: 40px; }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-card);
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #1e293b;
}

.stat-card h3 { font-size: 0.8rem; color: var(--text-dim); margin: 0; text-transform: uppercase; }
.stat-card p { font-size: 1.8rem; font-weight: bold; margin: 10px 0 0; color: var(--primary); }

.card {
  background: var(--bg-card);
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #1e293b;
  margin-bottom: 20px;
}

/* --- TABLES --- */
.table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid #1e293b; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { background: #1e293b; text-align: left; padding: 15px; color: var(--primary); }
td { padding: 15px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }

.search-bar {
    width: 100%;
    padding: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    margin-bottom: 20px;
    box-sizing: border-box;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover { opacity: 0.8; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-balance { background: var(--primary); color: #082f49; }
.btn-approve { background: var(--success); color: #052e16; }
.btn-danger { background: var(--danger); color: white; }
.btn-success { background: var(--success); color: #052e16; }
.btn-purple { background: var(--accent-purple); color: white; }

/* --- ALERTS --- */
.alert {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.alert-success { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); color: #86efac; }
.alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5; }
.alert-info { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--primary); color: #7dd3fc; }

/* --- LOADING SPINNER --- */
.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: currentColor;
    animation: spin 0.8s ease-in-out infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* --- MAINTENANCE STATUS INDICATOR --- */
.maintenance-status {
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}
.maintenance-status.online { background: rgba(34, 197, 94, 0.1); border: 2px solid var(--success); }
.maintenance-status.offline { background: rgba(239, 68, 68, 0.1); border: 2px solid var(--danger); }
.status-icon { font-size: 32px; }
.status-icon.online { color: var(--success); }
.status-icon.offline { color: var(--danger); }
.status-text h3 { margin: 0 0 5px 0; }
.status-text p { margin: 0; font-size: 14px; color: var(--text-dim); }

.maintenance-buttons { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
.maintenance-buttons button { padding: 12px 24px; font-size: 14px; font-weight: 700; }

/* --- CUSTOM TOGGLE SWITCH (DARK THEME) --- */
.toggle-switch {
    position: relative;
    display: inline-block;
    width: 46px;
    height: 24px;
    flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #334155;
    transition: .3s;
    border-radius: 24px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
}
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(22px); }

/* --- AUDIO FILE DISPLAY --- */
.uploaded-file-card {
    background: #1e293b;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #334155;
}

.file-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.file-icon {
    width: 40px;
    height: 40px;
    background: rgba(139, 92, 246, 0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-purple);
    font-size: 18px;
}

.file-details {
    flex: 1;
}

.file-details h4 {
    margin: 0;
    color: white;
    font-size: 14px;
}

.file-details small {
    color: var(--text-dim);
    font-size: 12px;
}

.audio-player {
    width: 100%;
    margin-top: 10px;
    height: 40px;
}

.file-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.no-file {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-style: italic;
}

.upload-status {
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 13px;
    display: none;
}

.upload-status.show {
    display: block;
}

.upload-status.success {
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid var(--success);
    color: #86efac;
}

.upload-status.error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--danger);
    color: #fca5a5;
}

.upload-status.info {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid var(--primary);
    color: #7dd3fc;
}

/* --- SOCIAL PREVIEW SPECIAL CARDS --- */
.social-card-preview {
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 15px;
    border: 1px solid #334155;
    max-width: 500px;
}
.social-card-img {
    width: 100%;
    height: 250px;
    background-size: cover;
    background-position: center;
    background-color: #0f172a;
    border-bottom: 1px solid #334155;
}
.social-card-details {
    padding: 15px;
}
.social-card-domain {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    margin-bottom: 5px;
}
.social-card-title {
    font-size: 15px;
    font-weight: bold;
    color: white;
    margin-bottom: 5px;
}
.social-card-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
}

@media (max-width: 768px) {
    .sidebar { width: 70px; }
    .sidebar span, .sidebar h2, .sidebar .site-name { display: none; }
    .main { margin-left: 70px; padding: 20px; }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Supreme Admin</h2>
  <div class="site-name">UNASEMEJE SMM GAINS</div>
  <a onclick="loadStats()" id="nav-stats" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
  <a onclick="loadUsers()" id="nav-users"><i class="fas fa-user-shield"></i> <span>User Control</span></a>
  <a onclick="loadDeposits()" id="nav-deposits"><i class="fas fa-money-bill-wave"></i> <span>Deposits</span></a>
  <a onclick="loadOrders()" id="nav-orders"><i class="fas fa-shopping-bag"></i> <span>Orders</span></a>
  
  <a onclick="loadTickets()" id="nav-tickets"><i class="fas fa-life-ring"></i> <span>Support Tickets</span></a>

  <a onclick="location.reload()" style="color: var(--danger);"><i class="fas fa-redo"></i> <span>Refresh</span></a>
</div>

<div class="main">
  <h1 id="pageTitle">Insights & Maintenance</h1>
  
  <div id="alertArea"></div>
  
  <div class="stats-grid">
      <div class="stat-card"><h3>Global Users</h3><p id="stat-users">0</p></div>
      <div class="stat-card"><h3>Total Float</h3><p id="stat-money">KES 0</p></div>
      <div class="stat-card"><h3>Action Needed</h3><p id="stat-deposits" style="color:#fbbf24">0</p></div>
  </div>

  <div id="contentArea">
      <div class="card" style="text-align: center; color: var(--text-dim);">
          <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
          <p>Loading Supreme Command...</p>
      </div>
  </div>
</div>

<script>
const API = "https://unasemeje-backend.vercel.app/api";

function showAlert(type, message) {
    const alertArea = document.getElementById('alertArea');
    const alertClass = type === 'success' ? 'alert-success' : type === 'error' ? 'alert-error' : 'alert-info';
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    
    alertArea.innerHTML = `
        <div class="alert ${alertClass}">
            <i class="fas ${icon}"></i>
            <span>${message}</span>
        </div>
    `;
    
    setTimeout(() => { alertArea.innerHTML = ''; }, 5000);
}

async function adminFetch(endpoint, method = "GET", body = null) {
  try {
    const opts = {
      method,
      headers: { "Content-Type": "application/json" }
    };
    if (body) opts.body = JSON.stringify(body);
    
    const res = await fetch(API + endpoint, opts);
    
    if (!res.ok) {
        const errorText = await res.text();
        console.error(`API Error ${res.status}:`, errorText);
        return { error: `HTTP ${res.status}: ${errorText}`, success: false };
    }
    
    const data = await res.json();
    return data;
  } catch (err) { 
      console.error('Fetch error:', err);
      document.getElementById("contentArea").innerHTML = `
        <div class="card" style="color: var(--danger); text-align: center;">
            <h3><i class="fas fa-exclamation-triangle"></i> Server Offline</h3>
            <p>Cannot connect to the backend API.</p>
            <p style="font-size: 12px; color: var(--text-dim);">Error: ${err.message}</p>
        </div>`;
      return { error: "Server Offline: " + err.message, success: false }; 
  }
}

/* =========================================
 * 📁 AUDIO FILE UPLOAD HANDLER (BASE64)
 * ========================================= */
async function uploadAudioFile(fileInputId, urlInputId, btnId, audioType, statusId) {
    const fileInput = document.getElementById(fileInputId);
    const urlInput = document.getElementById(urlInputId);
    const btn = document.getElementById(btnId);
    const statusDiv = document.getElementById(statusId);
    
    if (!fileInput.files || !fileInput.files[0]) {
        showAlert('error', 'Please select an audio file first!');
        return;
    }
    
    const file = fileInput.files[0];
    
    console.log(`\n[UPLOAD] Starting upload for ${audioType}`);
    console.log(`[UPLOAD] File: ${file.name}`);
    console.log(`[UPLOAD] Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`);
    console.log(`[UPLOAD] Type: ${file.type}`);
    
    // Check file size (max 10MB)
    if (file.size > 10 * 1024 * 1024) {
        showAlert('error', 'File too large! Maximum size is 10MB.');
        return;
    }
    
    // Check file type
    if (!file.type.startsWith('audio/')) {
        showAlert('error', 'Please upload an audio file (MP3, WAV, OGG).');
        return;
    }
    
    btn.innerHTML = '<span class="spinner"></span> Processing...';
    btn.disabled = true;
    
    if (statusDiv) {
        statusDiv.className = 'upload-status show info';
        statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Converting file to Base64...';
    }
    
    try {
        // Convert file to Base64 using FileReader
        const base64Data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                console.log(`[UPLOAD] Base64 conversion complete`);
                console.log(`[UPLOAD] Base64 length: ${reader.result.length} characters`);
                resolve(reader.result);
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
        
        if (statusDiv) {
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading to server...';
        }
        
        btn.innerHTML = '<span class="spinner"></span> Uploading...';
        
        // Send to backend
        console.log(`[UPLOAD] Sending to backend...`);
        const res = await fetch(API + '/admin/audio/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                audioType: audioType,
                audioData: base64Data,
                fileName: file.name,
                fileSize: file.size
            })
        });
        
        console.log(`[UPLOAD] Response status: ${res.status}`);
        const data = await res.json();
        console.log(`[UPLOAD] Response data:`, data);
        
        if (data.success) {
            urlInput.value = data.url;
            
            if (statusDiv) {
                statusDiv.className = 'upload-status show success';
                statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> File "${file.name}" uploaded successfully! (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            }
            
            showAlert('success', `✅ File "${file.name}" uploaded successfully!`);
            fileInput.value = ''; // Clear file input
            
            // Reload the audio settings to show the uploaded file
            setTimeout(() => {
                loadAudioSettingsAdmin();
            }, 1000);
        } else {
            if (statusDiv) {
                statusDiv.className = 'upload-status show error';
                statusDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> Upload failed: ${data.error || 'Unknown error'}`;
            }
            showAlert('error', 'Upload failed: ' + (data.error || 'Unknown error'));
        }
    } catch (err) {
        console.error('[UPLOAD] Error:', err);
        if (statusDiv) {
            statusDiv.className = 'upload-status show error';
            statusDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> Upload error: ${err.message}`;
        }
        showAlert('error', 'Upload error: ' + err.message);
    } finally {
        btn.innerHTML = '<i class="fas fa-upload"></i> Upload';
        btn.disabled = false;
    }
}

/* =========================================
 * 🗑️ DELETE UPLOADED AUDIO FILE
 * ========================================= */
async function deleteAudioFile(audioType, urlInputId) {
    if (!confirm('Are you sure you want to delete this audio file?')) return;
    
    try {
        const res = await fetch(API + '/admin/audio/file/' + audioType, {
            method: 'DELETE'
        });
        
        const data = await res.json();
        
        if (data.success) {
            document.getElementById(urlInputId).value = '';
            showAlert('success', 'Audio file deleted successfully!');
            loadAudioSettingsAdmin();
        } else {
            showAlert('error', 'Failed to delete: ' + (data.error || 'Unknown error'));
        }
    } catch (err) {
        showAlert('error', 'Delete error: ' + err.message);
    }
}

/* =========================================
 * 🎵 AUDIO & SOUND MANAGEMENT (WITH FILE DISPLAY)
 * ========================================= */
async function loadAudioSettingsAdmin() {
    setActiveNav('nav-audio', 'Audio & Sound Settings');
    
    document.getElementById("contentArea").innerHTML = `
        <div class="card" style="text-align: center; color: var(--text-dim);">
            <i class="fas fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
            <p>Loading Audio Settings...</p>
        </div>
    `;

    const data = await adminFetch("/admin/audio/settings");
    
    if (data.error) {
        document.getElementById("contentArea").innerHTML = `<div class="card" style="color:var(--danger)">Failed to load audio settings: ${data.error}</div>`;
        return;
    }

    const settings = data.data;
    const parseBool = (val) => val === true || val === 'true' || val === 1 || val === '1';

    const bgMusic = settings.bgMusic || { enabled: true, url: '', volume: 0.3 };
    const welcomeVoice = settings.welcomeVoice || { enabled: false, url: '' };
    const successSound = settings.successSound || { enabled: true, url: '' };
    const notificationSound = settings.notificationSound || { enabled: true, url: '' };
    const loginSound = settings.loginSound || { enabled: true, url: '' };

    console.log('[AUDIO] Loaded settings:', settings);
    console.log('[AUDIO] Background Music URL:', bgMusic.url ? `${bgMusic.url.substring(0, 50)}... (${bgMusic.url.length} chars)` : 'None');

    // Helper function to check if URL is a Base64 data URL
    const isBase64 = (url) => url && url.startsWith('data:audio/');
    
    // Helper to get file size from Base64
    const getBase64Size = (base64) => {
        if (!base64 || !isBase64(base64)) return null;
        const base64Length = base64.length - (base64.indexOf(',') + 1);
        const sizeInBytes = (base64Length * 3) / 4;
        return (sizeInBytes / 1024 / 1024).toFixed(2);
    };

    // Generate file display HTML
    const generateFileDisplay = (url, audioType, urlInputId) => {
        if (!url) {
            return `<div class="no-file"><i class="fas fa-file-audio"></i> No file uploaded yet</div>`;
        }
        
        if (isBase64(url)) {
            const size = getBase64Size(url);
            return `
                <div class="uploaded-file-card">
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fas fa-file-audio"></i>
                        </div>
                        <div class="file-details">
                            <h4>✅ Uploaded Audio File</h4>
                            <small>Size: ${size} MB • Stored in Database</small>
                        </div>
                    </div>
                    <audio controls class="audio-player" src="${url}"></audio>
                    <div class="file-actions">
                        <button type="button" class="btn-danger" onclick="deleteAudioFile('${audioType}', '${urlInputId}')" style="padding: 8px 16px; font-size: 12px;">
                            <i class="fas fa-trash"></i> Delete File
                        </button>
                    </div>
                </div>
            `;
        } else if (url.startsWith('http')) {
            return `
                <div class="uploaded-file-card">
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fas fa-link"></i>
                        </div>
                        <div class="file-details">
                            <h4>External URL</h4>
                            <small>${url.substring(0, 50)}...</small>
                        </div>
                    </div>
                    <audio controls class="audio-player" src="${url}"></audio>
                </div>
            `;
        } else if (url.startsWith('/')) {
            return `
                <div class="uploaded-file-card">
                    <div class="file-info">
                        <div class="file-icon">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <div class="file-details">
                            <h4>Local File</h4>
                            <small>${url}</small>
                        </div>
                    </div>
                    <audio controls class="audio-player" src="${url}"></audio>
                </div>
            `;
        } else {
            return `<div class="no-file"><i class="fas fa-file-audio"></i> No file uploaded yet</div>`;
        }
    };

    document.getElementById("contentArea").innerHTML = `
        <form id="audioSettingsForm" onsubmit="saveAudioSettingsAdmin(event)">
            
            <!-- Background Music -->
            <div class="card">
                <h3><i class="fas fa-music" style="color: var(--primary);"></i> Background Music</h3>
                <p style="color: var(--text-dim); font-size: 14px;">Continuous music playing in the background of the website.</p>
                <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="bgMusicEnabled" ${parseBool(bgMusic.enabled) ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                    <span>Enable Background Music</span>
                </div>
                <div style="margin-top: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 14px;">📁 Upload Audio File (MP3, WAV, OGG - Max 10MB)</label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                        <input type="file" id="bgMusicFile" accept="audio/*" style="flex: 1; min-width: 150px; padding: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 13px;">
                        <button type="button" class="btn-success" onclick="uploadAudioFile('bgMusicFile', 'bgMusicUrl', 'bgMusicUploadBtn', 'bgMusic', 'bgMusicStatus')" id="bgMusicUploadBtn" style="padding: 10px 15px; white-space: nowrap;">
                            <i class="fas fa-upload"></i> Upload

async function saveAudioSettingsAdmin(event) {
    event.preventDefault();
    const saveBtn = document.getElementById("saveAudioBtn");
    saveBtn.innerHTML = '<span class="spinner"></span> Saving Settings...';
    saveBtn.disabled = true;

    const payload = {
        bgMusicEnabled: document.getElementById("bgMusicEnabled").checked,
        bgMusicUrl: document.getElementById("bgMusicUrl").value.trim(),
        bgMusicVolume: parseFloat(document.getElementById("bgMusicVolume").value),
        
        welcomeVoiceEnabled: document.getElementById("welcomeVoiceEnabled").checked,
        welcomeVoiceUrl: document.getElementById("welcomeVoiceUrl").value.trim(),
        
        successSoundEnabled: document.getElementById("successSoundEnabled").checked,
        successSoundUrl: document.getElementById("successSoundUrl").value.trim(),
        
        loginSoundEnabled: document.getElementById("loginSoundEnabled").checked,
        loginSoundUrl: document.getElementById("loginSoundUrl").value.trim()
    };

    const res = await adminFetch("/admin/audio/settings", "POST", payload);
    
    saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Audio Configuration';
    saveBtn.disabled = false;

    if (res.success) {
        showAlert("success", "✅ Audio and Sound settings updated successfully!");
    } else {
        showAlert("error", "Failed to update audio settings: " + (res.error || "Unknown error"));
    }
}

async function promptBalance(userId, username, currentBalance) {
    const val = prompt(`Enter new balance for ${username}:`, currentBalance);
    if (val !== null && !isNaN(val)) {
        const res = await adminFetch("/admin/update-balance", "POST", { userId, amount: parseFloat(val) });
        if (res.success) {
            showAlert("success", `Balance updated for ${username}!`);
            loadUsers();
        } else {
            showAlert("error", "Failed to update balance.");
        }
    }
}

            <div class="status-text">
                <h3>System Status: ${isMaintenance ? 'MAINTENANCE MODE ACTIVE' : 'LIVE ONLINE'}</h3>
                <p>${isMaintenance ? 'Users cannot place orders or access services.' : 'All services and payment gateways functioning normally.'}</p>
            </div>
        </div>

        <div class="card">
            <h3>Maintenance Mode Switch</h3>
            <div class="maintenance-buttons">
                <button class="btn-danger" onclick="toggleMaintenance('on')">Activate Maintenance Mode</button>
                <button class="btn-success" onclick="toggleMaintenance('off')">Deactivate (Go Live)</button>
            </div>
        </div>

        <div class="card">
            <h3>Global Announcement Banner</h3>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="announceMsg" class="search-bar" style="margin:0" value="${settings.announcement || ''}" placeholder="Type announcement banner message...">
                <button class="btn-purple" onclick="saveAnnouncement()">Broadcast</button>
            </div>
        </div>
    `;
}

async function toggleMaintenance(action) {
    const res = await adminFetch("/admin/maintenance", "POST", { action });
    if (res.success) {
        showAlert("success", `Maintenance mode set to: ${res.maintenance ? 'ACTIVE' : 'OFF'}`);
        loadSiteControl();
    }
}

async function saveAnnouncement() {
    const message = document.getElementById("announceMsg").value;
    const res = await adminFetch("/admin/announce", "POST", { message });
    if (res.success) {
        showAlert("success", "Global Announcement Broadcasted!");
    }
}

/* =========================================
 * UTILITY HELPERS
 * ========================================= */
function setActiveNav(navId, pageTitle) {
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    const activeEl = document.getElementById(navId);
    if (activeEl) activeEl.classList.add('active');
    document.getElementById('pageTitle').innerText = pageTitle;
}

function filterTable(tableId, colIdx) {
    const input = document.getElementById("userSearch");
    const filter = input.value.toUpperCase();
    const table = document.getElementById(tableId);
    const tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {
        let td = tr[i].getElementsByTagName("td")[colIdx];
        if (td) {
            let txtValue = td.textContent || td.innerText;
            tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
        }
    }
}

// Initial Load
window.onload = () => {
    loadStats();
};
</script>
